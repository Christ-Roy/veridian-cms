name: CMS Staging (Nomad)

# Pipeline STAGING GitOps Nomad (remplace l'ancien deploy compose Dokploy dev-pub,
# décommissionné 2026-07-10). Sur push `staging` :
#   1. Tests lourds (lint + intégration Vitest) — gate avant tout deploy.
#   2. Build + push image staging GHCR (staging-<sha>).
#   3. Deploy Nomad staging via les verbes contraints du bastion (put-job /
#      deploy / cleanup) : plus de heredoc shell distant, plus de shell root.
#   4. Smoke lourd via Tailscale (health/admin/tenants/partners) sur cms.staging.veridian.site.
# Env staging PROCHE DE LA PROD : même image, Postgres co-localisé, données clonées.
# La promotion staging→main (→ deploy prod via ci.yml) reste une PR reviewée.

on:
  push:
    branches: [staging]
    paths-ignore:
      - 'todo/**'
      - 'docs/**'
      - 'runbooks/**'
      - '_archive/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: cms-staging-deploy
  cancel-in-progress: false  # un deploy Nomad en cours ne doit pas être interrompu

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: christ-roy/veridian-cms
  STAGING_URL: https://cms.staging.veridian.site

jobs:
  # ── Tests lourds : gate avant deploy (postgres + migrations + intégration) ──
  test:
    name: Tests lourds (migrations + intégration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: veridian_cms_test
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://cms:testpass@localhost:5432/veridian_cms_test
      PAYLOAD_SECRET: ci_secret_not_for_prod_64chars_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      PAYLOAD_DB_PUSH: "false"
      NODE_ENV: test
      SERVER_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint
        run: pnpm lint
      - name: Apply Payload migrations
        run: pnpm exec payload migrate
      - name: Tests d'intégration (Vitest)
        run: pnpm run test:int

  # ── Build + push image staging ────────────────────────────────────────────
  build:
    name: Build & push image staging
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image-tag: ${{ steps.tag.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Compute image tag
        id: tag
        run: |
          SHA7=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "image-tag=staging-$SHA7" >> $GITHUB_OUTPUT
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push runner (with retry)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 25
          max_attempts: 3
          retry_wait_seconds: 30
          retry_on: error
          command: |
            docker buildx build \
              --target runner \
              --push \
              -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.image-tag }} \
              -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-latest \
              -f ./Dockerfile \
              .

      - name: Sharp runtime smoke
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.image-tag }}"
          docker pull "$IMAGE"
          docker run --rm --network none --entrypoint node "$IMAGE" -e '
            const sharp = require("sharp");
            sharp({ create: { width: 1, height: 1, channels: 4, background: "#000000" } })
              .png().toBuffer()
              .then(() => console.log("sharp runtime OK"))
              .catch((error) => { console.error(error); process.exit(1); });
          '

  # ── Deploy Nomad staging + smoke lourd via Tailscale ──────────────────────
  deploy:
    name: Deploy Nomad staging (SSH bastion)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://cms.staging.veridian.site/admin
    env:
      JOB_FILE: deploy/cms-staging.nomad.hcl
      IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Install SSH key (bastion Nomad)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.NOMAD_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for attempt in 1 2 3; do
            if ssh-keyscan -T 15 -H "${{ secrets.NOMAD_BASTION_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null; then
              exit 0
            fi
            echo "ssh-keyscan tentative $attempt/3 en échec"
            sleep 3
          done
          echo "::error::impossible de récupérer la clé SSH du bastion"
          exit 1

      # ── Déploiement par verbes contraints (constat C4) ────────────────
      # La clé cms-ci-deploy@github porte désormais une commande forcée
      # `command="/usr/local/sbin/veridian-ci-deploy cms"` dans authorized_keys
      # du bastion : elle n'ouvre plus de shell. On ne transmet donc plus de
      # heredoc shell distant, seulement un verbe, un tier et un tag, validés
      # côté serveur. L'application est fixée dans la ligne de la clé : cette
      # clé ne peut pas déployer une autre application que le CMS.
      #
      # Le jeton management Nomad reste sur le bastion et ne traverse plus la
      # session SSH. Le `nomad job validate`, le `plan`, le pré-pull authentifié
      # sur ovh-dev, le `-check-index` anti-TOCTOU et le suivi du DeploymentID
      # exact jusqu'à l'état terminal sont maintenant DANS le script serveur :
      # ils ne sont pas perdus, seulement déplacés. Contrat de référence :
      # ~/veridian/secrets-migration/C4-CONTRAT-CI.md
      #
      # Toujours BatchMode=yes et jamais -t : la clé est en no-pty.
      - name: Envoi du HCL au bastion (verbe put-job)
        run: |
          # Le HCL part sur stdin ; le serveur refuse un HCL qui ne déclare pas
          # job "cms-staging", donc un fichier détourné ne passe pas.
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "${{ secrets.NOMAD_BASTION_USER }}@${{ secrets.NOMAD_BASTION_HOST }}" \
            "put-job staging" < "$JOB_FILE"

      - name: Déploiement Nomad staging (verbe deploy)
        run: |
          # validate + plan + pré-pull ovh-dev + run -detach -check-index +
          # suivi du déploiement ciblé : tout est exécuté côté bastion.
          # Sortie non nulle si le déploiement échoue ou part en auto-revert.
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "${{ secrets.NOMAD_BASTION_USER }}@${{ secrets.NOMAD_BASTION_HOST }}" \
            "deploy staging ${IMAGE_TAG}"

      - name: Nettoyage du matériel déposé sur le bastion (verbe cleanup)
        if: always()
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "${{ secrets.NOMAD_BASTION_USER }}@${{ secrets.NOMAD_BASTION_HOST }}" \
            "cleanup staging" || true

      # Staging privé Tailscale : un run ne peut servir de preuve de promotion
      # que si l'API et les routes métier répondent réellement depuis le tailnet.
      - name: Tailscale (connect runner to tailnet)
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-github
          version: latest

      - name: Smoke lourd staging (health/admin/tenants/partners)
        env:
          CMS_ADMIN_API_KEY: ${{ secrets.CMS_ADMIN_API_KEY_PROD }}
        run: |
          set -e
          echo "== health (retry 120s) =="
          ok=""
          for i in $(seq 1 12); do
            if curl -sf --max-time 10 "$STAGING_URL/api/health" | grep -q '"status":"ok"'; then ok=1; break; fi
            sleep 10
          done
          [ -n "$ok" ] || { echo "::error::health KO"; exit 1; }
          echo "✓ health"
          echo "== admin 200 =="
          code=$(curl -s -o /dev/null -w '%{http_code}' "$STAGING_URL/admin"); [ "$code" = 200 ] || { echo "::error::admin $code"; exit 1; }
          echo "✓ admin"
          echo "== API tenants + partners =="
          curl -sf "$STAGING_URL/api/partners?limit=1&depth=0" | grep -q '"docs"' || { echo "::error::partners KO"; exit 1; }
          echo "✓ smoke lourd OK — staging valide"

      - name: Effacement de la clé SSH sur le runner
        if: always()
        run: |
          # Le runner est éphémère, mais on ne laisse pas traîner la clé pendant
          # les étapes restantes (actions tierces incluses).
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519

      - name: Telegram notify
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then exit 0; fi
          ICON="✓"; [ "${{ job.status }}" != "success" ] && ICON="✗"
          curl -sf -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id=${TG_CHAT} \
            -d "text=$ICON CMS staging ${{ job.status }} — ${IMAGE_TAG} (${GITHUB_SHA:0:7})" >/dev/null || true
