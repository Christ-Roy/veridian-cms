name: Emergency Rollback (prod)

# Déclenché par :
#   - Le job deploy-prod du workflow ci.yml si smoke/health échoue
#   - Alertes monitoring via webhook GitHub `repository_dispatch`.
#
# Action (Nomad GitOps — l'ancien deploy Dokploy est décommissionné 2026-07-10) :
#   1. Verbe contraint `revert prod` sur le bastion → le script serveur revient
#      à la dernière version de job STABLE antérieure (donc l'image d'avant) et
#      suit le déploiement jusqu'à son état terminal. Note : le job cms a
#      `auto_revert = true`, qui couvre déjà le cas "nouveau deploy jamais
#      healthy". Ce workflow est le filet pour un breakage POST-deploy (alloc
#      healthy mais app cassée).
#   2. Trigger emergency-revert.yml pour le revert Git.
#   3. Telegram alert.

on:
  repository_dispatch:
    types: [rollback_triggered]
  workflow_dispatch:
    inputs:
      reason:
        description: "Raison du rollback manuel"
        required: true
        default: "manual"

concurrency:
  group: cms-rollback-prod
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  rollback:
    if: github.event.client_payload.app == 'cms' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Install SSH key (bastion Nomad)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.NOMAD_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for attempt in 1 2 3; do
            if ssh-keyscan -T 15 -H "${{ secrets.NOMAD_BASTION_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null; then
              exit 0
            fi
            echo "ssh-keyscan tentative $attempt/3 en échec"
            sleep 3
          done
          echo "::error::impossible de récupérer la clé SSH du bastion"
          exit 1

      # ── Rollback par verbe contraint (constat C4) ─────────────────────
      # La clé cms-ci-deploy@github porte une commande forcée
      # `command="/usr/local/sbin/veridian-ci-deploy cms"` : elle n'ouvre plus
      # de shell sur le bastion et ne peut plus lire le jeton management Nomad.
      # Le heredoc shell d'origine ne passerait plus.
      #
      # La recherche de la dernière version STABLE antérieure (et non CUR-1, qui
      # peut être une soumission jamais stabilisée), l'exigence d'un Evaluation
      # ID puis d'un Deployment ID, et le suivi jusqu'à l'état terminal sont
      # maintenant DANS le script serveur : le verbe sort non nul si l'une de
      # ces conditions n'est pas remplie. Contrat de référence :
      # ~/veridian/secrets-migration/C4-CONTRAT-CI.md
      #
      # Toujours BatchMode=yes et jamais -t : la clé est en no-pty.
      - name: Rollback Nomad prod (verbe revert)
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "${{ secrets.NOMAD_BASTION_USER }}@${{ secrets.NOMAD_BASTION_HOST }}" \
            "revert prod"

      - name: Effacement de la clé SSH sur le runner
        if: always()
        run: |
          # La suite du workflow n'est que du curl public et des appels GitHub.
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519

      - name: Wait for rollback healthy
        run: |
          echo "Waiting for cms.veridian.site/api/health post-rollback..."
          for i in $(seq 1 18); do
            if curl -sf --max-time 10 https://cms.veridian.site/api/health | grep -q '"status":"ok"'; then
              echo "✓ Rollback OK after $((i*10))s"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Rollback health failed after 3min — INCIDENT ESCALATION"
          exit 1

      - name: Trigger auto-revert PR
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GH_AUTOREVERT_PAT || secrets.GITHUB_TOKEN }}
          event-type: revert_after_rollback
          client-payload: |
            {
              "app": "cms",
              "sha": "${{ github.event.client_payload.sha || github.sha }}",
              "reason": "${{ github.event.client_payload.reason || inputs.reason }}"
            }

      - name: Telegram alert
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then exit 0; fi
          REASON="${{ github.event.client_payload.reason || inputs.reason }}"
          curl -sf -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id=${TG_CHAT} \
            -d "text=🚨 CMS prod ROLLBACK déclenché — raison: ${REASON}" \
            >/dev/null || true
